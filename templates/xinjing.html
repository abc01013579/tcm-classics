{% extends "base.html" %}
{% block title %}{{ sutra.title_zh }} - 中华典籍{% endblock %}
{% block content %}
  <article class="reading">
    <button type="button" class="print-btn no-print" onclick="window.print()">打印本经</button>
    <h1>{{ sutra.title_zh }}<span class="title-pinyin">Xin Jing</span></h1>

    {% for para in sutra.paragraphs %}
      <p>{{ para.zh }}</p>
    {% endfor %}
    <div class="en-block" lang="en">
      {% for para in sutra.paragraphs %}
        <p>{{ para.en }}</p>
      {% endfor %}
    </div>
  </article>
{% endblock %}
