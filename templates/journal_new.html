{% extends "base.html" %}
{% block title %}新随笔{% endblock %}
{% block content %}
  <p class="breadcrumb no-print">
    <a href="{{ url_for('journal_index') }}">随笔</a>
  </p>

  <h1>新随笔</h1>

  {% if error %}
    <p class="form-error">{{ error }}</p>
  {% endif %}

  <form method="post" class="entry-form">
    <label for="title">标题</label>
    <input type="text" id="title" name="title" value="{{ form.title }}" required>

    <label for="date">日期</label>
    <input type="date" id="date" name="date" value="{{ form.date }}" required>

    <label for="body">正文（支持 Markdown）</label>
    <p class="hint">代码请选中后点“插入代码块”，或手动用 ```c 和 ``` 包裹，否则不会按代码排版。</p>
    <button type="button" id="insert-code-btn" class="code-btn">插入代码块</button>
    <textarea id="body" name="body" rows="14" required>{{ form.body }}</textarea>

    <label for="body_en">English translation（选填）</label>
    <textarea id="body_en" name="body_en" rows="10">{{ form.body_en }}</textarea>
    <p class="hint">如果填写，段落数必须与正文一一对应，否则保存会失败。</p>

    <button type="submit">发布</button>
  </form>

  <script>
    document.getElementById("insert-code-btn").addEventListener("click", function () {
      var ta = document.getElementById("body");
      var start = ta.selectionStart;
      var end = ta.selectionEnd;
      var selected = ta.value.slice(start, end);
      var fenced = "```c\n" + selected + "\n```";
      ta.setRangeText(fenced, start, end, "end");
      if (!selected) {
        var cursor = start + "```c\n".length;
        ta.setSelectionRange(cursor, cursor);
      }
      ta.focus();
    });
  </script>
{% endblock %}
