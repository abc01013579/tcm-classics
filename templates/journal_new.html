{% extends "base.html" %}
{% block title %}新随笔{% endblock %}
{% block content %}
  <p class="breadcrumb no-print">
    <a href="{{ url_for('journal_index') }}">随笔</a>
  </p>

  <h1>新随笔</h1>

  {% if error %}
    <p class="form-error">{{ error }}</p>
  {% endif %}

  <form method="post" class="entry-form" enctype="multipart/form-data">
    <label for="title">标题</label>
    <input type="text" id="title" name="title" value="{{ form.title }}" required>

    <label for="date">日期</label>
    <input type="date" id="date" name="date" value="{{ form.date }}" required>

    <label for="body">正文（支持 Markdown）</label>
    <p class="hint">代码请选中后选好语言点“插入代码块”，或手动用 ``` 包裹，否则不会按代码排版。</p>
    <span class="code-controls">
      <select id="code-lang">
        <option value="c">C</option>
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="">(无语言标签)</option>
      </select>
      <button type="button" id="insert-code-btn" class="code-btn">插入代码块</button>
    </span>
    <textarea id="body" name="body" rows="14" required>{{ form.body }}</textarea>

    <label for="body_en">English translation（选填）</label>
    <textarea id="body_en" name="body_en" rows="10">{{ form.body_en }}</textarea>
    <p class="hint">如果填写，段落数必须与正文一一对应，否则保存会失败。</p>

    <label for="photo">添加照片（选填）</label>
    <input type="file" id="photo" name="photo" accept="image/*">
    <p class="hint">支持 jpg/png/gif/webp，会自动加在正文最后。</p>

    <button type="submit">发布</button>
  </form>

  <script>
    document.getElementById("insert-code-btn").addEventListener("click", function () {
      var ta = document.getElementById("body");
      var lang = document.getElementById("code-lang").value;
      var start = ta.selectionStart;
      var end = ta.selectionEnd;
      var selected = ta.value.slice(start, end);
      var openFence = "```" + lang + "\n";
      var fenced = openFence + selected + "\n```";
      ta.setRangeText(fenced, start, end, "end");
      if (!selected) {
        var cursor = start + openFence.length;
        ta.setSelectionRange(cursor, cursor);
      }
      ta.focus();
    });

    // Catches code pasted/typed straight into the body without a ```
    // fence (the recurring failure mode: it saves as unstyled plain text).
    // Covers C (#include/int main/brace+semicolon), Python (def/class),
    // and JS (function/console.log) tells. "class"/"import" alone are
    // deliberately excluded -- this user's entries discuss "asset class"
    // and "import tariffs" in plain English prose, which would false-
    // trigger on a loose match; class is only flagged in its code shape
    // (name followed by ':' or '{').
    var CODE_LIKE_RE = /#include\s*<|\bint\s+main\s*\(|\bdef\s+\w+\s*\(|\bclass\s+\w+\s*[:{]|\bconsole\.log\s*\(|\bfunction\s+\w+\s*\(|(;[ \t]*\n.*){2,}|\{[\s\S]*;[\s\S]*\}/;
    function looksLikeUnfencedCode(text) {
      return CODE_LIKE_RE.test(text) && text.indexOf("```") === -1;
    }
    document.querySelector(".entry-form").addEventListener("submit", function (e) {
      var body = document.getElementById("body").value;
      var bodyEn = document.getElementById("body_en").value;
      if (looksLikeUnfencedCode(body) || looksLikeUnfencedCode(bodyEn)) {
        e.preventDefault();
        alert("正文里似乎有代码，但没有用 ```c 和 ``` 包裹，保存后不会按代码排版。请选中代码后点\"插入代码块\"，再发布。");
      }
    });
  </script>
{% endblock %}
