{% extends "base.html" %}
{% block title %}新随笔{% endblock %}
{% block content %}
  <p class="breadcrumb no-print">
    <a href="{{ url_for('journal_index') }}">随笔</a>
  </p>

  <h1>新随笔</h1>

  {% if error %}
    <p class="form-error">{{ error }}</p>
  {% endif %}

  <form method="post" class="entry-form">
    <label for="title">标题</label>
    <input type="text" id="title" name="title" value="{{ form.title }}" required>

    <label for="date">日期</label>
    <input type="date" id="date" name="date" value="{{ form.date }}" required>

    <label for="body">正文（支持 Markdown）</label>
    <textarea id="body" name="body" rows="14" required>{{ form.body }}</textarea>

    <label for="body_en">English translation（选填）</label>
    <textarea id="body_en" name="body_en" rows="10">{{ form.body_en }}</textarea>
    <p class="hint">如果填写，段落数必须与正文一一对应，否则保存会失败。</p>

    <button type="submit">发布</button>
  </form>
{% endblock %}
